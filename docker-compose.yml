version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vouchsafe_postgres
    restart: always
    environment:
      POSTGRES_DB: vouchsafe
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: vouchsafe_redis
    restart: always
    ports:
      - "6379:6379"

  bot:
    build: .
    container_name: vouchsafe_bot
    restart: always
    command: python bot.py
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  listener:
    build: .
    container_name: vouchsafe_listener
    restart: always
    command: python listener.py
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  verifier:
    build: .
    container_name: vouchsafe_verifier
    restart: always
    command: python verifier.py
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

volumes:
  pgdata:
